<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파마브로스 품목리스트 대시보드</title>

<style>
  :root{
    --navy:#1F3864; --teal:#2E86AB; --bg:#F4F6F9; --card:#FFFFFF;
    --text:#22293B; --muted:#7A8296; --border:#E4E8F0; --danger:#C2255C;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Malgun Gothic","맑은 고딕",-apple-system,sans-serif;background:var(--bg);color:var(--text);}
  header{background:linear-gradient(135deg,var(--navy),#2C4C82);color:#fff;padding:22px 28px;}
  header h1{margin:0;font-size:22px;font-weight:700;}
  header p{margin:6px 0 0;font-size:12.5px;color:#C9D4EA;}
  main{max-width:1280px;margin:0 auto;padding:22px 20px 50px;}
  .panel{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(20,30,60,.08);}
  .panel h2{margin:0 0 6px;font-size:16px;color:var(--navy);}
  .hint{font-size:12px;color:var(--muted);margin-bottom:16px;}
  .breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:16px;flex-wrap:wrap;}
  .breadcrumb span.crumb{color:var(--teal);cursor:pointer;font-weight:600;}
  .breadcrumb span.crumb:hover{text-decoration:underline;}
  .breadcrumb span.sep{color:var(--muted);}
  .breadcrumb span.current{color:var(--navy);font-weight:700;}

  .data-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:#EEF2FA;border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12.5px;}
  .data-toolbar .left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .status-text{color:var(--muted);}
  .status-text.error{color:var(--danger);font-weight:600;}
  .tb-btn{padding:6px 12px;border-radius:7px;border:1px solid var(--border);background:#fff;color:var(--navy);
    font-size:12.5px;cursor:pointer;font-weight:600;}
  .tb-btn:hover{background:#F8FAFD;}
  .settings-box{display:none;margin-top:10px;padding:12px;border:1px dashed var(--border);border-radius:8px;background:#fff;}
  .settings-box.open{display:block;}
  .settings-box input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:8px;}
  .settings-box .hint2{font-size:11.5px;color:var(--muted);margin:2px 0 10px;line-height:1.5;}

  .brand-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .brand-card{cursor:pointer;border-radius:14px;padding:22px 18px;color:#fff;position:relative;overflow:hidden;
    box-shadow:0 2px 6px rgba(20,30,60,.12);transition:transform .15s ease;min-height:110px;}
  .brand-card:hover{transform:translateY(-3px);}
  .brand-card .name{font-size:17px;font-weight:800;}
  .brand-card .count{font-size:12.5px;opacity:.9;margin-top:6px;}
  .brand-card .arrow{position:absolute;right:16px;bottom:14px;font-size:20px;opacity:.55;}

  .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .product-card{cursor:pointer;border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:#fff;transition:box-shadow .15s ease, border-color .15s ease;}
  .product-card:hover{box-shadow:0 3px 10px rgba(20,30,60,.10);border-color:var(--teal);}
  .product-card .pname{font-weight:700;font-size:13.5px;color:var(--navy);}
  .product-card .ptype{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;color:#fff;}
  .product-card .pshelf{font-size:11.5px;color:var(--muted);margin-top:6px;}

  header{display:flex;align-items:center;gap:16px;}
  .back-top{display:none;align-items:center;gap:6px;background:#FFFFFF;color:var(--navy);border:none;
    padding:10px 18px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.25);flex-shrink:0;white-space:nowrap;}
  .back-top.show{display:inline-flex;}
  .back-top:hover{background:#EAF1FB;transform:translateX(-2px);}
  .back-top .arrow-ic{font-size:17px;line-height:1;}

  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .detail-head h3{margin:0;font-size:19px;color:var(--navy);}
  .detail-head .badge{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:600;color:#fff;}
  table.spec{width:100%;border-collapse:collapse;font-size:13px;}
  table.spec tr{border-bottom:1px solid var(--border);}
  table.spec tr:last-child{border-bottom:none;}
  table.spec th{width:190px;text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;background:#F8FAFD;vertical-align:top;white-space:nowrap;}
  table.spec td{padding:10px 12px;vertical-align:top;line-height:1.55;white-space:pre-line;}

  .empty-state{color:var(--muted);font-size:13px;padding:30px 0;text-align:center;}

  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:20px 0 40px;}
  @media (max-width:900px){
    .brand-grid,.product-grid{grid-template-columns:1fr 1fr;}
    table.spec th{width:120px;}
  }
</style>
</head>
<body>
<header>
  <button class="back-top" id="backBtn" onclick="goBack()"><span class="arrow-ic">←</span> 뒤로가기</button>
  <div>
    <h1>파마브로스 품목리스트 대시보드</h1>
    <p>데이터 출처: Google Sheets (실시간 연동)</p>
  </div>
</header>
<main>
  <div class="panel">
    <div class="data-toolbar">
      <div class="left">
        <span class="status-text" id="loadStatus">불러오는 중...</span>
      </div>
      <div class="left">
        <button class="tb-btn" id="settingsBtn">설정</button>
        <button class="tb-btn" id="refreshBtn">새로고침</button>
      </div>
    </div>
    <div class="settings-box" id="settingsBox">
      <label style="font-size:12px;color:var(--muted);">Google 스프레드시트 링크 또는 ID</label>
      <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/....../edit">
      <div class="hint2">시트는 [공유] &gt; "링크가 있는 모든 사용자 - 뷰어"로 설정되어 있어야 합니다.</div>
      <button class="tb-btn" id="saveSheetBtn">저장하고 새로고침</button>
    </div>

    <h2 id="panelTitle">브랜드 선택</h2>
    <div class="hint" id="panelHint">브랜드를 클릭하면 해당 브랜드의 제품 목록을 볼 수 있습니다.</div>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div id="viewArea"></div>
  </div>
</main>
<footer>파마브로스 커머스팀 · 품목리스트 대시보드</footer>

<script>
// ================= 설정 =================
const DEFAULT_SHEET_ID = '1_lMwc8qvXZdzx3qqscy2hNNGyDLZsZFbE0AyDxVcHTg';
const AUTO_REFRESH_MS = 5 * 60 * 1000;

let DATA = [];
let brandList = [];
let typeColorMap = {};
let brandColorMap = {};
let state = { brand:null, product:null };

const COLORS = ["#2E86AB","#5DA9E9","#F2A541","#E76F51","#6B9080","#BC4749","#9A8C98","#8FC1E3","#4C6EF5","#F76707","#087F5B","#C2255C","#5F3DC4","#1864AB"];
function colorFor(i){ return COLORS[i % COLORS.length]; }
function countBy(key){
  const m = {};
  DATA.forEach(d => { const v = d[key] || "미기재"; m[v] = (m[v]||0)+1; });
  return m;
}
function sortEntries(m, numeric){
  let e = Object.entries(m);
  if(numeric){ e.sort((a,b)=>parseInt(a[0])-parseInt(b[0])); } else { e.sort((a,b)=>b[1]-a[1]); }
  return e;
}
function computeDerived(){
  brandList = [...new Set(DATA.map(d=>d.브랜드))];
  const typeEntries = sortEntries(countBy('제품유형'));
  typeColorMap = {}; typeEntries.forEach((e,i)=> typeColorMap[e[0]] = colorFor(i));
  brandColorMap = {}; sortEntries(countBy('브랜드')).forEach((e,i)=> brandColorMap[e[0]] = colorFor(i));
}

// ================= CSV 파싱 & 구글시트 불러오기 =================
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows;
}
function extractSheetId(input){
  const s = (input||'').trim();
  const m = s.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return m[1];
  return s;
}
function getSheetId(){ return localStorage.getItem('item_dash_sheet_id') || DEFAULT_SHEET_ID; }
function setSheetId(v){ localStorage.setItem('item_dash_sheet_id', extractSheetId(v)); }
function buildCsvUrl(sheetId){ return `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&_=${Date.now()}`; }

// 시트 컬럼 순서: (빈칸A) 번호,브랜드,품번,제품명,제품유형,포장단위,단위중량,포장단위 및 중량,섭취량 및 섭취방법,기능성성분 및 함량,기능성 내용,소비기한,제조원,비고
function parseSheetCsv(text){
  const rows = parseCSV(text);
  const dataRows = rows.slice(2); // 1행: 제목, 2행: 헤더
  const list = [];
  dataRows.forEach(r=>{
    const productName = (r[4]||'').trim();
    if(!productName) return;
    list.push({
      번호: Number((r[1]||'').trim()) || null,
      브랜드: (r[2]||'').trim() || '미기재',
      품번: (r[3]||'').trim(),
      제품명: productName,
      제품유형: (r[5]||'').trim() || '미기재',
      포장단위: (r[6]||'').trim(),
      단위중량: (r[7]||'').trim(),
      "포장단위 및 중량": (r[8]||'').trim(),
      "섭취량 및 섭취방법": (r[9]||'').trim(),
      "기능성성분 및 함량": (r[10]||'').trim(),
      "기능성 내용": (r[11]||'').trim(),
      소비기한: (r[12]||'').trim(),
      제조원: (r[13]||'').trim(),
      비고: (r[14]||'').trim(),
    });
  });
  return list;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadData(){
  const statusEl = document.getElementById('loadStatus');
  statusEl.classList.remove('error');
  statusEl.textContent = '불러오는 중...';
  try{
    const sheetId = getSheetId();
    const res = await fetch(buildCsvUrl(sheetId));
    if(!res.ok) throw new Error('상태 코드 ' + res.status);
    const text = await res.text();
    DATA = parseSheetCsv(text);
    if(DATA.length === 0) throw new Error('불러온 품목이 없습니다. 시트 구조를 확인해주세요.');
    computeDerived();
    renderBrands();
    statusEl.textContent = `마지막 업데이트: ${new Date().toLocaleTimeString('ko-KR')} · 총 ${DATA.length}개 품목`;
  } catch(e){
    statusEl.classList.add('error');
    statusEl.textContent = '데이터를 불러오지 못했습니다. 시트가 "링크가 있는 모든 사용자 - 뷰어"로 공유되어 있는지 확인해주세요. (' + e.message + ')';
    document.getElementById('viewArea').innerHTML = '<div class="empty-state">품목 데이터를 불러오지 못했습니다.</div>';
  }
}

// ---------- 3-step navigator: 브랜드 -> 제품 -> 세부정보 ----------
function setBreadcrumb(parts){
  document.getElementById('breadcrumb').innerHTML = parts.map((p,i)=>{
    if(i === parts.length-1) return `<span class="current">${escapeHtml(p.label)}</span>`;
    return `<span class="crumb" onclick="${p.action}">${escapeHtml(p.label)}</span><span class="sep">›</span>`;
  }).join('');
}

function setBackBtn(show){
  document.getElementById('backBtn').classList.toggle('show', show);
}
function goBack(){
  if(state.product){ goToBrand(state.brand); }
  else if(state.brand){ renderBrands(); }
}
function renderBrands(){
  state = { brand:null, product:null };
  setBackBtn(false);
  document.getElementById('panelTitle').textContent = '브랜드 선택';
  document.getElementById('panelHint').textContent = '브랜드를 클릭하면 해당 브랜드의 제품 목록을 볼 수 있습니다.';
  setBreadcrumb([{label:'🏠 브랜드 목록'}]);
  const counts = countBy('브랜드');
  const html = brandList.map(b => `
    <div class="brand-card" style="background:${brandColorMap[b]}" onclick="goToBrand('${b.replace(/'/g,"\\'")}')">
      <div class="name">${escapeHtml(b)}</div>
      <div class="count">${counts[b]}개 품목</div>
      <div class="arrow">→</div>
    </div>
  `).join('');
  document.getElementById('viewArea').innerHTML = `<div class="brand-grid">${html}</div>`;
}

function goToBrand(brand){
  state = { brand, product:null };
  setBackBtn(true);
  document.getElementById('panelTitle').textContent = `${brand} 제품 목록`;
  document.getElementById('panelHint').textContent = '제품명을 클릭하면 상세 스펙을 볼 수 있습니다.';
  setBreadcrumb([
    {label:'🏠 브랜드 목록', action:'renderBrands()'},
    {label:brand}
  ]);
  const products = DATA.filter(d => d.브랜드 === brand);
  const html = products.map(p => `
    <div class="product-card" onclick="goToProduct(${p.번호})">
      <div class="pname">${escapeHtml(p.제품명)}</div>
      <span class="ptype" style="background:${typeColorMap[p.제품유형]||'#999'}">${escapeHtml(p.제품유형)}</span>
      <div class="pshelf">소비기한 ${escapeHtml(p.소비기한)} · ${escapeHtml(p.포장단위)}</div>
    </div>
  `).join('');
  document.getElementById('viewArea').innerHTML = `<div class="product-grid">${html}</div>`;
}

function goToProduct(no){
  const p = DATA.find(d => d.번호 === no);
  if(!p) return;
  state = { brand:p.브랜드, product:no };
  setBackBtn(true);
  document.getElementById('panelTitle').textContent = '제품 상세정보';
  document.getElementById('panelHint').textContent = '';
  setBreadcrumb([
    {label:'🏠 브랜드 목록', action:'renderBrands()'},
    {label:p.브랜드, action:`goToBrand('${p.브랜드.replace(/'/g,"\\'")}')`},
    {label:p.제품명}
  ]);
  const rows = [
    ['품번', p.품번 || '-'],
    ['제품유형', p.제품유형],
    ['포장단위', p.포장단위],
    ['단위중량 (1정/포당)', p.단위중량],
    ['포장단위 및 중량', p['포장단위 및 중량']],
    ['섭취량 및 섭취방법', p['섭취량 및 섭취방법']],
    ['기능성성분 및 함량', p['기능성성분 및 함량'] || '-'],
    ['기능성 내용', p['기능성 내용'] || '-'],
    ['소비기한', p.소비기한],
    ['제조원', p.제조원],
    ['비고', p.비고 || '-'],
  ];
  document.getElementById('viewArea').innerHTML = `
    <div class="detail-head">
      <div>
        <h3>${escapeHtml(p.제품명)}</h3>
        <span class="badge" style="background:${typeColorMap[p.제품유형]||'#999'}">${escapeHtml(p.제품유형)}</span>
      </div>
    </div>
    <table class="spec">
      ${rows.map(r => `<tr><th>${escapeHtml(r[0])}</th><td>${escapeHtml(r[1])}</td></tr>`).join('')}
    </table>
  `;
}
window.goBack = goBack;
window.renderBrands = renderBrands;
window.goToBrand = goToBrand;
window.goToProduct = goToProduct;

// ================= 이벤트 바인딩 =================
document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('settingsBtn').addEventListener('click', ()=>{
  const box = document.getElementById('settingsBox');
  box.classList.toggle('open');
  if(box.classList.contains('open')){
    document.getElementById('sheetUrlInput').value = 'https://docs.google.com/spreadsheets/d/' + getSheetId() + '/edit';
  }
});
document.getElementById('saveSheetBtn').addEventListener('click', ()=>{
  const val = document.getElementById('sheetUrlInput').value.trim();
  if(!val){ alert('시트 링크 또는 ID를 입력하세요.'); return; }
  setSheetId(val);
  document.getElementById('settingsBox').classList.remove('open');
  loadData();
});

loadData();
setInterval(loadData, AUTO_REFRESH_MS);
</script>
</body>
</html>
